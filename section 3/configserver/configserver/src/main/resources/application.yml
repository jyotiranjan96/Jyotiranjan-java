spring:
  application:
    name: configserver

  profiles:
    active: git

  cloud:
    config:
      server:
        git:
          uri: https://github.com/jyotiranjan96/Jyotiranjan-java.git
          default-label: main
          timeout: 5
          clone-on-start: true
          force-pull: true
          # 📂 Update this to match your current section's config folder path on GitHub:
          search-paths:
            - "section 3/v2-spring-cloud-config/configserver/configserver/src/main/resources/config"

management:
  endpoints:
    web:
      exposure:
        include: "*"

  health:
    readiness-state:
      enabled: true
    liveness-state:
      enabled: true

  endpoint:
    health:
      probes:
        enabled: true

server:
  port: 8071

encrypt:
  key: "45D81EC1EF61DF9AD8D3E5BB397F9"
