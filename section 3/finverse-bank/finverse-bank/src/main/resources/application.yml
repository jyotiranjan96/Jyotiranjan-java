spring:
  application:
    name: "finverse-bank"

  config:
    import: "optional:configserver:http://localhost:8071/"

management:
  endpoints:
    web:
      exposure:
        include: "*"

  health:
    readiness-state:
      enabled: true
    liveness-state:
      enabled: true

  endpoint:
    health:
      probes:
        enabled: true

# 🚀 ADD THIS TO DISABLE EUREKA CLIENT TEMPORARILY:
eureka:
  client:
    register-with-eureka: false
    fetch-registry: false
